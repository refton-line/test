<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- C clicker 0.7 icon, Ember / Graphite. Source for 64-256 px and previews (app-icon-small.svg covers 16-48 px). -->
  <defs>
    <linearGradient id="plate" x1="0" y1="40" x2="0" y2="984" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1d2232"/>
      <stop offset="1" stop-color="#090b10"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="40" x2="0" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4a5470"/>
      <stop offset="1" stop-color="#4a5470" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ambient" cx="511.4" cy="512" r="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff4d5e" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#ff4d5e" stop-opacity="0.04"/>
      <stop offset="0.655" stop-color="#ff4d5e" stop-opacity="0.26"/>
      <stop offset="0.85" stop-color="#ff4d5e" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ff4d5e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ember" x1="709" y1="300" x2="300" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff8a4c"/>
      <stop offset="0.45" stop-color="#ff4d5e"/>
      <stop offset="1" stop-color="#d52a46"/>
    </linearGradient>
    <linearGradient id="gloss" x1="723" y1="328" x2="269" y2="372" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff4f2" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#fff4f2" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#fff4f2" stop-opacity="0"/>
    </linearGradient>
    <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="spark" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="16"/></filter>
    <clipPath id="plateClip"><rect x="40" y="40" width="944" height="944" rx="236"/></clipPath>
  </defs>
  <rect x="40" y="40" width="944" height="944" rx="236" fill="url(#plate)"/>
  <g clip-path="url(#plateClip)">
    <rect x="40" y="40" width="944" height="944" fill="url(#ambient)"/>
    <!-- The ring the C belongs to: the start button of the app. -->
    <circle cx="511.4" cy="512" r="262" fill="none" stroke="#ff4d5e" stroke-opacity="0.16" stroke-width="22"/>
    <path d="M709 340a262 262 0 1 0 0 344" fill="none" stroke="#ff4d5e" stroke-opacity="0.6" stroke-width="104" stroke-linecap="round" filter="url(#bloom)"/>
  </g>
  <rect x="43" y="43" width="938" height="938" rx="233" fill="none" stroke="url(#rim)" stroke-width="6"/>
  <path d="M709 340a262 262 0 1 0 0 344" fill="none" stroke="url(#ember)" stroke-width="112" stroke-linecap="round"/>
  <!-- Gloss along the outer top of the stroke (r 280 around the C centre). -->
  <path d="M729.5 322.5A289 289 0 0 0 261 367.5" fill="none" stroke="url(#gloss)" stroke-width="18" stroke-linecap="round"/>
  <!-- Glint at the leading end, like the light that travels around the ring. -->
  <circle cx="709" cy="340" r="44" fill="#ffd2c2" opacity="0.55" filter="url(#spark)"/>
  <circle cx="709" cy="340" r="15" fill="#fff4f2"/>
</svg>
